packages:
  darwin:
    brews:
      - "git"
  windows:
    winget:
      - 7zip.7zip
      - AgileBits.1Password
      - Git.Git
      - Greenshot.Greenshot
      - Helm.Helm
      - JanDeDobbeleer.OhMyPosh
      - Kubernetes.kustomize
      - Kubernetes.kubectl
      - Derailed.k9s
      - Microsoft.Azure.Kubelogin
      - Microsoft.AzureCLI
      - Microsoft.Bicep
      - Microsoft.Edge
      - Microsoft.Edit
      - Microsoft.PowerShell
      - Microsoft.VisualStudioCode
      - Microsoft.WindowsApp
      - Microsoft.WindowsTerminal
      - twpayne.chezmoi
    # Installed only when the optionalApps prompt is answered true.
    wingetOptional:
      - Dropbox.Dropbox
      - Insta360.Link.Controller
      - Logseq.Logseq
      - Microsoft.PowerToys
    # Installed only when the email is not an @microsoft.com address.
    wingetNonMicrosoft:
      - Tailscale.Tailscale
    fonts:
      - name: FiraCode
        family: FiraCode Nerd Font
      - name: Hack
        family: Hack Nerd Font Mono
  linux:
    apt:
      - "vim"
    apks:
      - "git"
      - "vim"
      - "tmux"
